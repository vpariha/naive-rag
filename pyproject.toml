[project]
name = "naive-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vpariha", email = "vpariha27@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=0.3.23",
    "docling>=2.150.1",
    "gradio>=6.32.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openrouter>=0.2.9",
    "langchain-text-splitters>=1.1.3",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
]

[project.scripts]
naive-rag = "naive_rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
